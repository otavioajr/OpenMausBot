# Top bar — the macOS-style menu bar. Slim, translucent, full width, showing
# the focused window's title on the left and a clock on the right.
# Kept deliberately cheap: no systray polling, no launcher icons here.
rounded = 0
border_width = 0
background_color = #f6f6f8 88
border_color = #000000 0

# A second background id for the clock/task text areas (transparent).
rounded = 0
border_width = 0
background_color = #000000 0
border_color = #000000 0

panel_items = TC
panel_size = 100% 26
panel_margin = 0 0
panel_padding = 8 0 8
panel_background_id = 1
panel_position = top center horizontal
panel_layer = bottom
panel_monitor = all
wm_menu = 1
panel_dock = 0
strut_policy = follow_size
autohide = 0
font_shadow = 0

# Focused window title, left aligned — stands in for the macOS app menu.
taskbar_mode = single_desktop
taskbar_padding = 4 0 6
taskbar_background_id = 2
taskbar_active_background_id = 2
taskbar_name = 0

task_text = 1
task_icon = 1
task_centered = 0
task_maximum_size = 260 24
task_padding = 6 2 6
task_font = DejaVu Sans 9
task_font_color = #1d1d1f 100
task_active_font_color = #1d1d1f 100
task_background_id = 2
task_active_background_id = 2
task_tooltip = 1

time1_format = %a %d %b  %H:%M
time1_font = DejaVu Sans 9
clock_font_color = #1d1d1f 100
clock_padding = 8 0
clock_background_id = 2
clock_tooltip = %A %d %B %Y
