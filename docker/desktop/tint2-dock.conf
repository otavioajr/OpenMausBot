# Bottom dock — macOS-style launcher: centered, rounded, translucent, with
# large icons that magnify slightly on hover. Launchers only (no taskbar), so
# it stays a thin, cheap process.
rounded = 18
border_width = 1
background_color = #ffffff 55
border_color = #ffffff 40

# Hover/pressed background for launcher icons.
rounded = 12
border_width = 0
background_color = #ffffff 70
border_color = #000000 0

panel_items = L
# tint2 has no "shrink to fit" for width: `0` means full width and any
# percentage is a fixed width. 20% (~288px at 1440) comfortably fits the three
# 40px launchers with padding, and stays centered like a macOS dock.
panel_size = 20% 62
panel_margin = 0 8
panel_padding = 10 6 12
panel_background_id = 1
panel_position = bottom center horizontal
panel_layer = top
panel_monitor = all
panel_dock = 0
strut_policy = none
autohide = 0
font_shadow = 0

launcher_padding = 6 0 10
launcher_background_id = 0
launcher_icon_background_id = 0
launcher_icon_size = 40
launcher_icon_asb = 100 0 0
# Without an explicit theme tint2 resolves no icons at all and the dock
# collapses to a sliver. Humanity ships colourful app icons in this image;
# Adwaita is the fallback chain for anything it misses.
launcher_icon_theme = Humanity
launcher_icon_theme_override = 0
launcher_tooltip = 1

launcher_item_app = /home/desktop/.local/share/applications/omb-terminal.desktop
launcher_item_app = /home/desktop/.local/share/applications/omb-browser.desktop
launcher_item_app = /home/desktop/.local/share/applications/omb-files.desktop
