[general]
# Terminal cells require a true monospaced font. Inter is proportional and
# looked unnaturally spaced because lxterminal forced every glyph into cells.
fontname=DejaVu Sans Mono 10
selchars=-A-Za-z0-9,./?%&#:_
scrollback=2000
bgcolor=rgba(28,28,32,0.94)
fgcolor=#e6e6ea
palette_color_0=#1c1c20
palette_color_1=#ff5f57
palette_color_2=#28c840
palette_color_3=#febc2e
palette_color_4=#0a84ff
palette_color_5=#bf5af2
palette_color_6=#5ac8fa
palette_color_7=#e6e6ea
palette_color_8=#4a4a52
palette_color_9=#ff7b73
palette_color_10=#4cd964
palette_color_11=#ffd60a
palette_color_12=#409cff
palette_color_13=#da8fff
palette_color_14=#70d7ff
palette_color_15=#ffffff
color_preset=Custom
disallowbold=false
cursorblinks=true
cursorunderline=false
audiblebell=false
tabpos=top
geometry_columns=96
geometry_rows=26
hidescrollbar=true
hidemenubar=true
hideclosebutton=true
hidepointer=false
